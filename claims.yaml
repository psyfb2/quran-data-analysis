      The basmala "بسم الله الرحمن الرحيم" (bismillah al-rahman al-rahim) is
      claimed to consist of exactly 19 Arabic letters — the basis of the
      "Code 19" literature.
    source: >-
      Rashad Khalifa / "Submitters" Code-19 literature. Untrusted; re-derived below.
    asserted_value: 19
    operational_definition: >-
      Edition-independent (operates on the literal basmala string, not a corpus
      scan). Normalisation: canonical normalize() pipeline (tatweel removed,
      tashkeel stripped, hamza folded), no final-form folding. Counted: the number
      of non-space characters in normalize("بسم الله الرحمن الرحيم") — i.e. letters
      only, diacritics and spaces excluded.
    expected_result: len(normalize("بسم الله الرحمن الرحيم").replace(" ", "")) == 19
    requires_morphology: false
    rederivation_note: >-
      Re-derived on 2026-06-02. normalize("بسم الله الرحمن الرحيم") =
      "بسم الله الرحمن الرحيم"; removing spaces leaves 19 letters. Reproduces the
      asserted figure — a clean deterministic match anchor independent of edition.
    tags: [letter-freq]

  - id: qaf-surah50-frequency
    description: >-
      Surah Qaf (chapter 50), which opens with the disjoined letter ق (qaf), is
      claimed to contain the letter ق exactly 57 times.
    source: >-
      Classical muqatta'at letter-frequency literature (qaf-in-Surah-Qaf claim).
      Untrusted; re-derived below.
    asserted_value: 57
    operational_definition: >-
      Edition: Tanzil Simple-Clean. Normalisation: canonical normalize() pipeline
      (tashkeel stripped so only consonantal skeleton letters are counted), no
      final-form folding. Scope: surah 50 only. Basmala: the separated basmala
      prefixed to verse 1 of surah 50 is EXCLUDED (counts cover the numbered ayas
      of surah 50 only). Counted: occurrences of the character ق across all words of
      surah 50 via per-sura letter frequency.
    expected_result: letter_frequency(surah=50)['ق'] == 57
    requires_morphology: false
    rederivation_note: >-
      Re-derived on 2026-06-02 by summing letter_frequency over the words of surah
      50: ق = 57 in Tanzil Simple-Clean (identical in Uthmani). Reproduces the
      asserted figure — a clean deterministic letter-frequency match anchor.
    tags: [letter-freq]

  - id: noon-surah68-frequency
    description: >-
      Surah Al-Qalam (chapter 68), which opens with the disjoined letter ن (nun),
      is examined for the frequency of the letter ن; popularly asserted as 131.
    source: >-
      Muqatta'at letter-frequency literature (nun-in-Surah-Qalam). Untrusted;
      re-derived below.
    asserted_value: 131
    operational_definition: >-
      Edition: Tanzil Simple-Clean. Normalisation: canonical normalize() pipeline,
      no final-form folding. Scope: surah 68 only. Basmala: separated basmala of
      surah 68 EXCLUDED. Counted: occurrences of the character ن across all words of
      surah 68 via per-sura letter frequency. Note the opening word is written نون
      ("nun") in full; this surface spelling (two visible ن letters) is what is
      counted, an orthographic convention that the claim does not always disclose.
    expected_result: letter_frequency(surah=68)['ن'] == 131
    requires_morphology: false
    ambiguity_note: >-
      Counts of the opening disjoined-letter mnemonic depend on whether the word
      نون is counted by its spelled-out letters or as the single symbol ن; the
      popular figure does not always disclose this. Recorded with the spelled-out
      convention above; treat as ambiguous if a source uses the symbol convention.
    rederivation_note: >-
      Re-derived on 2026-06-02 by summing letter_frequency over the words of surah
      68: ن = 131 in Tanzil Simple-Clean (identical in Uthmani), under the
      spelled-out نون convention. Reproduces the asserted figure on that convention.
    tags: [letter-freq, ambiguous]

