# Claims register — the source of truth for quantifiable numerical/linguistic
# claims about the Arabic text of the Quran that are circulated as evidence of
# divine authorship. Governed by the machine-readable schema in
# src/quran_analysis/claims/schema.py (and the generated claims.schema.json).
#
# Task 6 (Phase 1) research output. Every asserted figure below is the *claimed*
# (popular) number; it is UNTRUSTED. Each entry's `rederivation_note` records the
# value actually MEASURED from the vendored Arabic corpus via the Task-4
# primitives (re-derivation discipline, PRD req 13) — the verdict in the Task-8
# runner/Task-9 report comes from the measurement, never from the source.
#
# Edition policy (load-bearing — see agentdocs/claims-register.md): popular
# modern-spelling claims are evaluated against **Tanzil Simple-Clean**, because
# Uthmani rasm differs orthographically (e.g. surface form `الحياة` = 0 in
# Uthmani, spelled `الحيوة`, but 63 in Simple-Clean). Each operational_definition
# names its own edition, basmala handling and diacritic handling so it is
# self-contained and does not rely on any global convention.
#
# `requires_morphology: true` marks claims whose canonical figure depends on a
# singular-noun lemma / root count that surface-form, substring, letter-frequency
# and abjad primitives cannot faithfully reproduce. These drive Task 7.
claims:
  # ----------------------------------------------------------------------------
  # Constant claims (a count is asserted to equal a calendar / cosmological number)
  # ----------------------------------------------------------------------------
  - id: yawm-singular-365
    description: >-
      The singular word for "day" (yawm, يوم) is claimed to occur exactly 365
      times in the Quran, matching the number of days in a solar year.
    source: >-
      Popular numerical-miracle literature (e.g. Tariq Al-Suwaidan-style word-count
      tables widely reproduced online and in da'wah pamphlets). Asserted figure is
      treated as untrusted and re-derived below.
    asserted_value: 365
    operational_definition: >-
      Edition: Tanzil Simple-Clean. Normalisation: canonical normalize() pipeline
      (tatweel removed, tashkeel stripped, hamza folded; final-form folding NOT
      applied). Basmala: separated basmalas (suras 2–114 except 9) excluded; the
      sura-1 basmala counts as aya 1:1. Counted: the singular noun lemma "yawm"
      across all case endings and attached clitics, EXCLUDING the dual (yawmayn),
      plurals (ayyam) and the adverbial fused form "yawma'idhin". This is a
      lemma-level count, not an exact surface-form count — it cannot be reproduced
      from count_by_form/count_by_substring alone.
    expected_result: singular-lemma-count(yawm) == 365
    requires_morphology: true
    rederivation_note: >-
      Re-derived from Tanzil Simple-Clean on 2026-06-02. count_by_form("يوم") = 217
      (identical in Uthmani); count_by_substring("يوم") = 590 (over-counts: includes
      "يومئذ", plurals and clitics). Neither surface measure equals 365, confirming
      the asserted figure depends on a singular-noun lemma count that needs
      morphological data — hence requires_morphology.
    tags: [constant, morphology]

  - id: shahr-month-12
    description: >-
      The singular word for "month" (shahr, شهر) is claimed to occur exactly 12
      times, matching the number of months in a year.
    source: >-
      Popular numerical-miracle literature (same word-count-table tradition as
      yawm-singular-365). Untrusted; re-derived below.
    asserted_value: 12
    operational_definition: >-
      Edition: Tanzil Simple-Clean. Normalisation: canonical normalize() pipeline,
      no final-form folding. Basmala: separated basmalas excluded. Counted: the
      singular noun lemma "shahr" across case endings and clitics, EXCLUDING the
      plural "ashhur"/"shuhur". Lemma-level — not reproducible from surface counts
      alone.
    expected_result: singular-lemma-count(shahr) == 12
    requires_morphology: true
    rederivation_note: >-
      Re-derived from Tanzil Simple-Clean on 2026-06-02. count_by_form("شهر") = 4
      (identical in Uthmani); count_by_substring("شهر") = 20. Neither equals 12; the
      asserted figure requires a singular-lemma count of "shahr" (excluding plurals)
      — needs morphology.
    tags: [constant, morphology]

  - id: ayyam-days-30
    description: >-
      The plural word for "days" (ayyam, أيام) is claimed to occur 30 times,
      matching the number of days in a month.
    source: >-
      Popular numerical-miracle literature. Untrusted; re-derived below.
    asserted_value: 30
    operational_definition: >-
      Edition: Tanzil Simple-Clean for surface re-derivation; QAC v0.4 morphology
      for the lemma count. Normalisation: canonical normalize() pipeline (which
      folds the initial hamza, so "أيام" and "ايام" coincide), no final-form
      folding. Basmala: separated basmalas excluded. Counted: the claim prescribes
      the plural lemma "ayyam" of yawm, but QAC lemmatises both singular يوم and
      plural أيام under the single shared lemma "yawom" — so the lemma count cannot
      isolate the plural and measures 405 (singular + plural combined), not a
      plural-only figure. Lemma-level — not an exact surface-form count.
    expected_result: plural-lemma-count(ayyam) == 30
    requires_morphology: true
    rederivation_note: >-
      Re-derived from Tanzil Simple-Clean on 2026-06-02. count_by_form("أيام") = 20
      (and "ايام" = 20; identical in Uthmani after hamza folding);
      count_by_substring("أيام") = 29 (over-counts: captures clitic-attached forms
      such as أيامه / أيامهم, yet still does not reach 30). 20 != 30, so the asserted
      figure depends on a lemma count that captures clitic-attached forms — needs
      morphology.
    tags: [constant, morphology]

  - id: sab-seven-heavens
    description: >-
      The word "seven" (sab', سبع) — as in the seven heavens — is claimed to occur
      exactly 7 times in the Quran.
    source: >-
      Popular numerical-miracle literature (seven-heavens word-count claim).
      Untrusted; re-derived below.
    asserted_value: 7
    operational_definition: >-
      Edition: Tanzil Simple-Clean. Normalisation: canonical normalize() pipeline,
      no final-form folding. Basmala: separated basmalas excluded. The popular
      statement does not disclose whether it counts only the bare cardinal "سبع",
      or also "سبعا", "سبعة", "سبعون", and feminine/clitic variants, nor whether the
      restriction is to the "seven heavens" context only. Counted here (for the
      re-derivation) as the exact normalised surface form "سبع".
    expected_result: count_by_form(sab) == 7
    requires_morphology: false
    ambiguity_note: >-
      The popular convention is undisclosed: under exact surface form "سبع" the
      measured value is 14, not 7, and the claim does not state which derived forms
      or contexts are included. Without a disclosed counting rule this resolves to
      ambiguous rather than a forced match/mismatch.
    rederivation_note: >-
      Re-derived from Tanzil Simple-Clean on 2026-06-02. count_by_form("سبع") = 14
      (identical in Uthmani). 14 != 7; the asserted 7 cannot be reproduced under any
      disclosed surface rule, so the claim is flagged ambiguous.
    tags: [constant, ambiguous]

