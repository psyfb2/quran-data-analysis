  - id: bahr-barr-water-ratio
    description: >-
      The word "sea" (bahr, بحر) is claimed to occur 32 times and "land" (barr,
      بر) 13 times, so sea/(sea+land) = 32/45 ≈ 71.1%, matching the proportion of
      the Earth's surface covered by water.
    source: >-
      Popular numerical-miracle literature (sea/land water-ratio claim, widely
      attributed to Abdullah Arik / "the water claim"). Untrusted; re-derived below.
    asserted_value: 32
    operational_definition: >-
      Edition: Tanzil Simple-Clean. Normalisation: canonical normalize() pipeline,
      no final-form folding. Basmala: separated basmalas excluded. The popular claim
      counts ALL derived forms of the root b-h-r meaning sea (singular, dual,
      plural, definite, clitic-attached) as 32, and the forms of b-r-r meaning land
      as 13 — a lemma/root count. The asserted_value here is the sea figure (32).
    expected_result: lemma-count(bahr-sea) == 32
    requires_morphology: true
    ambiguity_note: >-
      The popular convention is undisclosed and partly contested: it must exclude
      homographs of b-r-r meaning "righteousness/piety" from the "land" tally, and
      the bahr forms it includes are not specified. Surface counts do not reproduce
      it, so without a disclosed lemma rule it is ambiguous.
    rederivation_note: >-
      Re-derived from Tanzil Simple-Clean on 2026-06-02. count_by_form("البحر") = 23,
      count_by_form("بحر") = 1; count_by_substring("بحر") = 40 (includes unrelated
      forms). No surface measure equals 32; the asserted figure is a root-level
      count over b-h-r — flagged morphology.
    tags: [pair-count, morphology, ambiguous]

