  # ----------------------------------------------------------------------------
  # Pair-equality claims ("X occurs as often as its opposite")
  # ----------------------------------------------------------------------------
  - id: dunya-akhira-equal
    description: >-
      The words "this world" (al-dunya, الدنيا) and "the hereafter" (al-akhira,
      الآخرة) are claimed to occur an equal number of times (popularly, 115 each).
    source: >-
      Popular numerical-miracle pair-count literature. Untrusted; re-derived below.
    asserted_value: equal
    operational_definition: >-
      Edition: Tanzil Simple-Clean. Normalisation: canonical normalize() pipeline
      (which folds the hamza/madda so "الآخرة" and "الاخرة" coincide), no final-form
      folding. Basmala: separated basmalas excluded. Counted: the exact normalised
      surface forms "الدنيا" and "الآخرة" via count_by_form; the claim holds iff the
      two counts are equal.
    expected_result: count_by_form(al-dunya) == count_by_form(al-akhira)
    requires_morphology: false
    ambiguity_note: >-
      The popular "115 each" statement does not disclose which forms are counted for
      al-akhira (exact form, all derived forms, or with/without the article). Under
      exact surface form al-dunya = 115 but al-akhira = 71, so the pair is NOT equal
      on the disclosed surface definition; the asserted equality depends on an
      undisclosed counting convention.
    rederivation_note: >-
      Re-derived from Tanzil Simple-Clean on 2026-06-02. count_by_form("الدنيا") =
      115 vs count_by_form("الآخرة") = 71 (identical in Uthmani). 115 != 71 — the
      surface-form pair mismatches the asserted equality.
    tags: [pair-count]

  - id: hayat-mawt-equal
    description: >-
      The words "life" (al-hayat, الحياة) and "death" (al-mawt, الموت) are claimed
      to occur an equal number of times (popularly, 145 each).
    source: >-
      Popular numerical-miracle pair-count literature (life/death pair). Untrusted;
      re-derived below.
    asserted_value: equal
    operational_definition: >-
      Edition: Tanzil Simple-Clean (REQUIRED here: in Uthmani rasm "life" is spelled
      الحيوة so its surface form is 0 — see agentdocs/claims-register.md). Normalisation:
      canonical normalize() pipeline, no final-form folding. Basmala: separated
      basmalas excluded. The popular "145 each" figure counts every derived form of
      the roots ح-ي-ي (life) and م-و-ت (death), not just the definite singular
      nouns; the canonical test therefore needs root/lemma counts.
    expected_result: lemma-count(life) == lemma-count(death)
    requires_morphology: true
    ambiguity_note: >-
      The popular "145" figure aggregates all derived forms of each root and does
      not disclose the exact inclusion rules; the definite-singular surface forms
      give a different (non-equal) result, so the equality cannot be confirmed
      without disclosed root-level counting.
    rederivation_note: >-
      Re-derived from Tanzil Simple-Clean on 2026-06-02. count_by_form("الحياة") = 63
      vs count_by_form("الموت") = 35 (in Uthmani "الحياة" = 0 because of rasm). The
      definite-singular surface forms are not equal and neither equals 145, so the
      asserted equality depends on a root-level lemma count — flagged morphology.
    tags: [pair-count, morphology]

