[project]
name = "quran-data-analysis"
version = "0.1.0"
description = "Verify or refute widely-claimed numerical/linguistic patterns in the Arabic text of the Quran (CSTC-6)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
# Runtime dependencies start empty and are added per-task as needed
# (e.g. pyyaml + pydantic when the corpus loader / claims schema land).
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quran_analysis"]

[dependency-groups]
dev = [
    "ruff==0.14.2",
    "pytest>=8",
    "pre-commit>=3",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
