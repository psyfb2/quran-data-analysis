name: CI

on:
  push:
    branches: [main]
  pull_request:

# Avoid duplicate runs: a push to a PR branch is already covered by the
# pull_request event, so push only triggers on the default branch. Cancel
# superseded in-progress runs for the same ref (e.g. rapid successive pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test
